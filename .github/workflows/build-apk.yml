name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - run: npm install
      - run: npm install -g @expo/cli
      - run: npx expo prebuild --platform android --no-install
      - run: chmod +x android/gradlew

      - name: Create JS Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export --platform android --output-dir /tmp/expo-export
          cp /tmp/expo-export/bundles/*.js android/app/src/main/assets/index.android.bundle || true
          npx react-native bundle --platform android --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res || true

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Find APK
        run: find android -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PetanqueCoach-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
